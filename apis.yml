aid: archer
name: Archer
description: >-
  Archer (archermoney.com) is a Y Combinator (Spring 2026) financial-infrastructure
  startup building global payouts, stablecoin banking, and yield infrastructure for
  the companies powering the AI data economy. Archer lets data marketplaces, AI labor
  platforms, and reinforcement-learning environment providers onboard workers globally,
  pay contributors instantly with stablecoins, and earn yield on idle platform balances
  while funds remain on platform. The company aims to be the financial layer for the
  global workforce generating the data that trains frontier AI models, reducing
  cross-border payout costs and improving the financial experience for contributors.
  Founded by Benjamin Nguyen (CEO) and Vivek Yanamadula (CTO); early stage, no public
  developer surface or API specification published yet.
